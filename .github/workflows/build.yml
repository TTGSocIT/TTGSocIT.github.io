name: Build Next.js App

on:
  push:
    branches:
      - v1.0.0
  pull_request:
    branches:
      - v1.0.0

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          npm install

      - name: Build Next.js app
        run: |
          npm run build
